<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write — ArticleX</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      background: var(--bg-subtle);
      position: relative;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--accent);
      background: rgba(232,98,26,.05);
    }
    .upload-zone input[type=file] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .upload-progress {
      height: 4px; background: var(--border); border-radius: 2px;
      margin-top: 10px; overflow: hidden; display: none;
    }
    .upload-progress-bar {
      height: 100%; background: var(--gradient); border-radius: 2px;
      width: 0%; transition: width .2s ease;
    }
    .cover-preview {
      width: 100%; aspect-ratio: 16/9; border-radius: var(--radius);
      overflow: hidden; display: none; position: relative; margin-top: 12px;
    }
    .cover-preview img { width: 100%; height: 100%; object-fit: cover; }
    .cover-remove {
      position: absolute; top: 10px; right: 10px;
      background: rgba(26,22,18,.7); color: #fff;
      border-radius: var(--radius-full); padding: 6px 12px;
      font-size: .8rem; font-weight: 600; cursor: pointer;
      transition: var(--transition);
    }
    .cover-remove:hover { background: rgba(220,38,38,.9); }
    .char-limit-warn { color: #ef4444 !important; }
  </style>
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="script.js"></script>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="write-page">
    <div class="container-sm">
      <div class="write-header">
        <h1 id="page-title">✍️ Write a New Story</h1>
        <p style="color:var(--text-secondary);margin-top:8px">Share your ideas with the world. Make it count.</p>
      </div>

      <form id="article-form" onsubmit="handleSubmit(event)">

        
        <div class="form-group">
          <label class="form-label">Article Title *</label>
          <input type="text" id="field-title" class="form-input"
            placeholder="Write a compelling title…" maxlength="150" required>
          <div class="char-count" id="title-count">0 / 150</div>
        </div>

        
        <div class="form-group">
          <label class="form-label">
            Excerpt
            <span style="color:var(--text-muted);font-weight:400">(auto-generated if empty)</span>
          </label>
          <textarea id="field-excerpt" class="form-input"
            style="min-height:80px;resize:vertical"
            placeholder="A short summary shown on article cards…"
            maxlength="300"></textarea>
          <div class="char-count" id="excerpt-count">0 / 300</div>
        </div>

        
        <div class="form-group">
          <label class="form-label">
            Cover Image
            <span style="color:var(--text-muted);font-weight:400">(optional · max 5 MB)</span>
          </label>

          <div class="upload-zone" id="upload-zone">
            <input type="file" id="cover-file-input" accept="image/*" onchange="handleFileSelect(event)">
            <div id="upload-prompt">
              <div style="font-size:2.5rem;margin-bottom:8px">🖼️</div>
              <div style="font-weight:600;color:var(--text-primary);margin-bottom:4px">
                Click to upload or drag & drop
              </div>
              <div style="font-size:.8rem;color:var(--text-muted)">PNG, JPG, WebP — up to 5 MB</div>
            </div>
            <div class="upload-progress" id="upload-progress">
              <div class="upload-progress-bar" id="upload-progress-bar"></div>
            </div>
          </div>

          
          <div class="cover-preview" id="cover-preview">
            <img id="cover-preview-img" src="" alt="Cover preview">
            <button type="button" class="cover-remove" onclick="removeCover()">✕ Remove</button>
          </div>

          
          <div style="margin-top:10px">
            <input type="url" id="field-image" class="form-input"
              placeholder="…or paste an image URL directly"
              style="font-size:.85rem">
          </div>
        </div>

        
        <div class="form-group">
          <label class="form-label">
            Tags
            <span style="color:var(--text-muted);font-weight:400">(comma-separated, max 8)</span>
          </label>
          <input type="text" id="field-tags" class="form-input"
            placeholder="e.g. technology, design, science">
          <div id="tag-suggestions"
            style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"></div>
        </div>

        
        <div class="form-group">
          <label class="form-label">Content *</label>
          <div class="write-toolbar">
            <button type="button" onclick="fmt('**','**')" title="Bold"><b>B</b></button>
            <button type="button" onclick="fmt('*','*')"   title="Italic"><i>I</i></button>
            <button type="button" onclick="fmt('\n## ','\n')">H2</button>
            <button type="button" onclick="fmt('\n### ','\n')">H3</button>
            <button type="button" onclick="fmt('\n> ','\n')">❝</button>
            <button type="button" onclick="fmt('\`','\`')">{ }</button>
            <button type="button" onclick="fmt('\n- ','')">• List</button>
            <button type="button" onclick="fmt('\n1. ','')">1. List</button>
            <button type="button" onclick="fmt('\n---\n','')">— HR</button>
            <button type="button" onclick="fmt('\n```\n','\n```')">Code block</button>
            <button type="button" onclick="insertInlineImageUrl()">Image URL</button>
            <button type="button" onclick="pickInlineImage()">Upload image</button>
          </div>
          <input type="file" id="inline-image-input" accept="image/*"
            onchange="handleInlineImageUpload(event)" style="display:none">
          <textarea id="field-content" class="form-input form-textarea"
            placeholder="Tell your story… Markdown formatting is supported."
            required></textarea>
          <div class="char-count" id="content-count">0 words</div>
        </div>

        
        <div id="preview-section" style="display:none;margin-bottom:24px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <h3 style="font-size:1rem;font-weight:600">👁 Preview</h3>
            <button type="button" class="btn btn-sm btn-secondary" onclick="hidePreview()">✕ Close</button>
          </div>
          <div style="border:1px solid var(--border);border-radius:var(--radius);
            padding:32px;background:var(--bg-card)">
            <h1 id="preview-title" style="font-size:2rem;margin-bottom:16px"></h1>
            <div class="article-body" id="preview-body"></div>
          </div>
        </div>

        
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="togglePreview()">👁 Preview</button>
          <button type="button" class="btn btn-secondary" onclick="saveDraft()">💾 Save draft</button>
          <button type="submit" class="btn btn-primary" id="submit-btn">
            <span id="submit-text">🚀 Publish</span>
          </button>
        </div>

      </form>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  
  <script>
    const editId = new URLSearchParams(location.search).get('id');
    let coverUrl = ''; // final image URL (either uploaded or pasted)

    // ── Init ──────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      onAuthReady(async user => {
        if (!user) { window.location.href = 'login.html'; return; }

        if (editId) {
          document.getElementById('page-title').textContent = '✏️ Edit Story';
          document.getElementById('submit-text').textContent = '✓ Update';
          await loadForEdit();
        }

        loadTagSuggestions();
        setupCounters();
        setupUrlImagePreview();
        setupDragDrop();
        loadDraft();
      });
    });

    // ── Load article for editing ──────────────────────────
    async function loadForEdit() {
      try {
        const a = await apiRequest(`/articles/${editId}`);
        const profile = Auth.getProfile();
        if (profile && profile.id !== a.authorId) {
          Toast.error('You can only edit your own articles');
          setTimeout(() => window.location.href = 'index.html', 1500);
          return;
        }
        document.getElementById('field-title').value   = a.title   || '';
        document.getElementById('field-excerpt').value = a.excerpt || '';
        document.getElementById('field-tags').value    = (a.tags   || []).join(', ');
        document.getElementById('field-content').value = a.content || '';
        if (a.image) {
          coverUrl = a.image;
          document.getElementById('field-image').value = a.image;
          showCoverPreview(a.image);
        }
        triggerAllCounters();
      } catch (e) { Toast.error('Failed to load article: ' + e.message); }
    }

    // ── Firebase Storage upload ───────────────────────────
    async function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) await uploadCover(file);
    }

    async function uploadCover(file) {
      if (file.size > 5 * 1024 * 1024) {
        Toast.error('Image must be smaller than 5 MB');
        return;
      }

      const progressWrap = document.getElementById('upload-progress');
      const progressBar  = document.getElementById('upload-progress-bar');
      const prompt       = document.getElementById('upload-prompt');

      progressWrap.style.display = 'block';
      prompt.style.opacity = '0.5';

      try {
        const user  = fbAuth().currentUser;
        const ext   = file.name.split('.').pop();
        const path  = `covers/${user.uid}/${Date.now()}.${ext}`;
        const ref   = fbStorage().ref(path);
        const task  = ref.put(file);

        task.on('state_changed',
          snap => {
            const pct = (snap.bytesTransferred / snap.totalBytes) * 100;
            progressBar.style.width = pct + '%';
          },
          err => { Toast.error('Upload failed: ' + err.message); resetUploadZone(); },
          async () => {
            coverUrl = await task.snapshot.ref.getDownloadURL();
            document.getElementById('field-image').value = coverUrl;
            showCoverPreview(coverUrl);
            resetUploadZone();
            Toast.success('Cover image uploaded!');
          }
        );
      } catch (e) {
        Toast.error('Upload error: ' + e.message);
        resetUploadZone();
      }
    }

    function resetUploadZone() {
      document.getElementById('upload-progress').style.display = 'none';
      document.getElementById('upload-progress-bar').style.width = '0%';
      document.getElementById('upload-prompt').style.opacity = '1';
    }

    function showCoverPreview(url) {
      const preview = document.getElementById('cover-preview');
      document.getElementById('cover-preview-img').src = url;
      preview.style.display = 'block';
      document.getElementById('upload-zone').style.display = 'none';
    }

    function removeCover() {
      coverUrl = '';
      document.getElementById('field-image').value = '';
      document.getElementById('cover-preview').style.display = 'none';
      document.getElementById('upload-zone').style.display = 'block';
      document.getElementById('cover-file-input').value = '';
    }

    // Drag and drop
    function setupDragDrop() {
      const zone = document.getElementById('upload-zone');
      zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('drag-over'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
      zone.addEventListener('drop', e => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) uploadCover(file);
        else Toast.error('Please drop an image file');
      });
    }

    // URL paste preview
    function setupUrlImagePreview() {
      const input = document.getElementById('field-image');
      input.addEventListener('input', () => {
        const url = input.value.trim();
        if (url) {
          coverUrl = url;
          const img = new Image();
          img.onload  = () => showCoverPreview(url);
          img.onerror = () => { };
          img.src = url;
        }
      });
    }

    // ── Tag suggestions ───────────────────────────────────
    async function loadTagSuggestions() {
      try {
        const tags = await apiRequest('/articles/tags');
        document.getElementById('tag-suggestions').innerHTML =
          tags.slice(0, 10).map(t =>
            `<button type="button" class="tag" onclick="addTag('${esc(t)}')">${esc(t)}</button>`
          ).join('');
      } catch (_) {}
    }

    function addTag(tag) {
      const input    = document.getElementById('field-tags');
      const existing = input.value.split(',').map(t => t.trim()).filter(Boolean);
      if (!existing.includes(tag)) input.value = [...existing, tag].join(', ');
    }

    // ── Character / word counters ─────────────────────────
    function setupCounters() {
      const cfg = [
        { id:'field-title',   cid:'title-count',   mode:'char', max:150 },
        { id:'field-excerpt', cid:'excerpt-count',  mode:'char', max:300 },
        { id:'field-content', cid:'content-count',  mode:'word' },
      ];
      cfg.forEach(({ id, cid, mode, max }) => {
        document.getElementById(id)?.addEventListener('input', () => {
          const el  = document.getElementById(id);
          const out = document.getElementById(cid);
          if (!out) return;
          if (mode === 'char') {
            out.textContent = `${el.value.length} / ${max}`;
            out.classList.toggle('char-limit-warn', el.value.length >= max * .9);
          } else {
            const w = el.value.trim().split(/\s+/).filter(Boolean).length;
            out.textContent = `${w} words · ~${Math.max(1, Math.ceil(w / 200))} min read`;
          }
        });
      });
    }

    function triggerAllCounters() {
      ['field-title','field-excerpt','field-content'].forEach(id =>
        document.getElementById(id)?.dispatchEvent(new Event('input'))
      );
    }

    // ── Toolbar format insertion ──────────────────────────
    function fmt(before, after) {
      const ta  = document.getElementById('field-content');
      const s   = ta.selectionStart, e = ta.selectionEnd;
      const sel = ta.value.substring(s, e);
      ta.value  = ta.value.substring(0, s) + before + sel + after + ta.value.substring(e);
      ta.focus();
      ta.selectionStart = s + before.length;
      ta.selectionEnd   = s + before.length + sel.length;
      ta.dispatchEvent(new Event('input'));
    }

    function insertInlineImageUrl() {
      const url = prompt('Paste image URL');
      if (!url) return;
      fmt(`\n![image](${url})\n`, '');
    }

    function pickInlineImage() {
      document.getElementById('inline-image-input')?.click();
    }

    async function handleInlineImageUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        Toast.error('Inline image must be smaller than 5 MB');
        return;
      }
      try {
        const user = fbAuth().currentUser;
        const ext = file.name.split('.').pop();
        const path = `content-images/${user.uid}/${Date.now()}.${ext}`;
        const ref = fbStorage().ref(path);
        const snap = await ref.put(file);
        const url = await snap.ref.getDownloadURL();
        fmt(`\n![image](${url})\n`, '');
        Toast.success('Inline image uploaded');
      } catch (err) {
        Toast.error('Inline upload failed: ' + err.message);
      } finally {
        e.target.value = '';
      }
    }

    // ── Preview ───────────────────────────────────────────
    function togglePreview() {
      const sec = document.getElementById('preview-section');
      if (sec.style.display === 'none') {
        document.getElementById('preview-title').textContent =
          document.getElementById('field-title').value || 'Untitled';
        document.getElementById('preview-body').innerHTML =
          simpleMarkdown(document.getElementById('field-content').value);
        sec.style.display = 'block';
        sec.scrollIntoView({ behavior: 'smooth' });
      } else {
        sec.style.display = 'none';
      }
    }
    function hidePreview() { document.getElementById('preview-section').style.display = 'none'; }

    function simpleMarkdown(md) {
      return md
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm,  '<h2>$1</h2>')
        .replace(/^# (.+)$/gm,   '<h1>$1</h1>')
        .replace(/!\[(.*?)\]\((https?:\/\/[^\s)]+)\)/g, '<p><img src="$2" alt="$1" style="max-width:100%;border-radius:12px;margin:12px 0"></p>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g,     '<em>$1</em>')
        .replace(/`{3}([\s\S]*?)`{3}/g, '<pre><code>$1</code></pre>')
        .replace(/`(.+?)`/g,       '<code>$1</code>')
        .replace(/^> (.+)$/gm,     '<blockquote>$1</blockquote>')
        .replace(/^- (.+)$/gm,     '<li>$1</li>')
        .replace(/^---$/gm,        '<hr>')
        .split('\n').filter(l => l.trim())
        .map(l => l.match(/^<[h|u|b|l|p|h|c|p]/) ? l : `<p>${l}</p>`).join('');
    }

    // ── Draft autosave ────────────────────────────────────
    function saveDraft() {
      localStorage.setItem('articlex_draft', JSON.stringify({
        title:   document.getElementById('field-title').value,
        excerpt: document.getElementById('field-excerpt').value,
        content: document.getElementById('field-content').value,
        image:   coverUrl,
        tags:    document.getElementById('field-tags').value,
      }));
      Toast.success('Draft saved!');
    }

    function loadDraft() {
      if (editId) return;
      const raw = localStorage.getItem('articlex_draft');
      if (!raw) return;
      const d = JSON.parse(raw);
      if (!d.title && !d.content) return;

      const banner = document.createElement('div');
      banner.style.cssText = `padding:14px 20px;background:var(--bg-subtle);
        border:1px solid var(--accent);border-radius:var(--radius);
        margin-bottom:24px;display:flex;align-items:center;
        justify-content:space-between;gap:12px`;
      banner.innerHTML = `
        <span style="font-size:.9rem">📄 You have an unsaved draft.</span>
        <div style="display:flex;gap:8px">
          <button class="btn btn-sm btn-primary"   onclick="restoreDraft(this.closest('[style]'))">Restore</button>
          <button class="btn btn-sm btn-secondary" onclick="discardDraft(this.closest('[style]'))">Discard</button>
        </div>`;
      document.getElementById('article-form').prepend(banner);
    }

    function restoreDraft(banner) {
      const d = JSON.parse(localStorage.getItem('articlex_draft') || '{}');
      ['title','excerpt','content','tags'].forEach(k => {
        const el = document.getElementById(`field-${k}`);
        if (el) { el.value = d[k] || ''; el.dispatchEvent(new Event('input')); }
      });
      if (d.image) {
        coverUrl = d.image;
        document.getElementById('field-image').value = d.image;
        showCoverPreview(d.image);
      }
      banner.remove();
      Toast.info('Draft restored!');
    }

    function discardDraft(banner) {
      localStorage.removeItem('articlex_draft');
      banner.remove();
    }

    // ── Submit ────────────────────────────────────────────
    async function handleSubmit(e) {
      e.preventDefault();

      const title   = document.getElementById('field-title').value.trim();
      const content = document.getElementById('field-content').value.trim();
      const excerpt = document.getElementById('field-excerpt').value.trim();
      const tags    = document.getElementById('field-tags').value.trim();
      const image   = coverUrl || document.getElementById('field-image').value.trim();
      const btn     = document.getElementById('submit-btn');

      if (!title || !content) return Toast.error('Title and content are required');
      if (content.length < 50) return Toast.error('Content too short (min 50 characters)');

      btn.disabled = true;
      document.getElementById('submit-text').textContent = editId ? '⏳ Updating…' : '⏳ Publishing…';

      try {
        const payload = { title, content, excerpt, image, tags };
        const result  = editId
          ? await apiRequest(`/articles/${editId}`, { method: 'PUT',  body: JSON.stringify(payload) })
          : await apiRequest('/articles',            { method: 'POST', body: JSON.stringify(payload) });
        logAnalyticsEvent(editId ? 'update_article' : 'publish_article', {
          article_id: result.id || result._id || editId || '',
          title: title || '',
        });

        if (!editId) localStorage.removeItem('articlex_draft');
        Toast.success(editId ? 'Article updated!' : 'Article published!');
        const id = result.id || result._id;
        setTimeout(() => window.location.href = `article.html?id=${id}`, 900);
      } catch (err) {
        Toast.error(err.message);
        btn.disabled = false;
        document.getElementById('submit-text').textContent = editId ? '✓ Update' : '🚀 Publish';
      }
    }
  </script>
</body>
</html>
